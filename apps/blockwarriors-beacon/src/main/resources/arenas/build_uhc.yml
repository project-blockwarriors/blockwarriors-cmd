# Build UHC Arena Configuration
# 2v2 duel with building, bow, melee, and healing

name: "Build UHC Arena"
game_type: "build_uhc"

# WorldEdit schematic file (relative to schematics folder)
schematic: "builduhcmap1.schem"
# Paste origin for the schematic in the match world.
# Tune these coordinates if your map appears shifted.
schematic_origin: {x: 0, y: 65, z: 0}

# Team spawn points (tune these to match the schematic layout)
spawns:
  blue_team:
    - {x: 25, y: 65, z: -4, yaw: -90, pitch: 0}
    - {x: 25, y: 65, z: 4, yaw: -90, pitch: 0}
  red_team:
    - {x: -25, y: 65, z: -4, yaw: 90, pitch: 0}
    - {x: -25, y: 65, z: 4, yaw: 90, pitch: 0}

# Arena boundaries — max Y enforces build height limit (floor 65 + 16)
boundaries:
  min: {x: -40, y: 50, z: -40}
  max: {x: 40, y: 81, z: 40}

# Game-specific objectives
objectives:
  time_limit_seconds: 300
  build_height_limit: 81
  sudden_death_seconds: 30

resources: []

special_blocks: {}
